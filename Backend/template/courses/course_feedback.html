{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Feedback for {{ course.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>Leave Feedback for {{ course.title }}</h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">
                    {% if feedback_exists %}Update Feedback{% else %}Submit Feedback{% endif %}
                </button>
                <a href="{% url 'course_detail' course.slug %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
