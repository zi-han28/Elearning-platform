{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add Material to {{ lesson.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>Add Material to {{ lesson.title }}</h2>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Upload</button>
                <a href="{% url 'course_detail' lesson.module.course.slug %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
