{% extends 'base.html' %}

{% block title %}Chat - {{ course.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Course Discussion: {{ course.title }}</h2>
    
    <div class="card">
        <div class="card-body">
            <div id="chat-log" class="mb-3" style="height: 400px; overflow-y: scroll; border: 1px solid #eee; padding: 10px;">
    {% for message in initial_messages %}
    <div>
        <strong>{{ message.user.username }}:</strong> {{ message.message }}
    </div>
    {% endfor %}
</div>
            
            <div class="input-group">
                <input id="chat-message-input" type="text" class="form-control" placeholder="Type your message...">
                <button id="chat-message-submit" class="btn btn-primary" type="button">Send</button>
            </div>
        </div>
    </div>
    
    <a href="{% url 'course_detail' course.slug %}" class="btn btn-secondary mt-3">Back to Course</a>
</div>

<script>
    const roomName = '{{ course.slug }}';
    const username = '{{ username }}';
    
    const chatSocket = new WebSocket(
        'ws://' + window.location.host +
        '/ws/chat/' + roomName + '/'
    );
    
    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const chatLog = document.querySelector('#chat-log');
        
        const messageElement = document.createElement('div');
        messageElement.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
        chatLog.appendChild(messageElement);
        
        // Scroll to bottom
        chatLog.scrollTop = chatLog.scrollHeight;
    };
    
    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };
    
    document.querySelector('#chat-message-input').focus();
    document.querySelector('#chat-message-input').onkeyup = function(e) {
        if (e.key === 'Enter') {
            document.querySelector('#chat-message-submit').click();
        }
    };
    
    document.querySelector('#chat-message-submit').onclick = function(e) {
        const messageInputDom = document.querySelector('#chat-message-input');
        const message = messageInputDom.value;
        
        if (message) {
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            messageInputDom.value = '';
        }
    };
</script>
{% endblock %}
